<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild West Grill - Menú</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --accent: #ff9800;
            --accent-hover: #e68900;
            --danger: #e53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px; /* Espacio para la barra fija del carrito */
        }

        /* HEADER Y LOGO */
        .header-container {
            text-align: center;
            padding: 15px 10px;
            background: #181818;
            border-bottom: 2px solid var(--accent);
        }

        .logo-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 5px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: #000;
        }

        .header-container h1 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 2px;
        }

        .header-container p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* CARRUSEL LIMPIO (SIN TEXTOS NI PRECIOS) */
        .carousel-wrapper {
            padding: 15px;
            background: #151515;
            display: flex;
            justify-content: center;
        }

        .carousel {
            width: 100%;
            max-width: 500px;
            height: 250px;
            overflow: hidden;
            position: relative;
            border-radius: 12px;
            border: 2px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .carousel-track {
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-slide {
            width: 33.333%;
            height: 100%;
            flex-shrink: 0;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CATEGORÍAS / FILTROS */
        .categories-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 15px;
            background: #181818;
            white-space: nowrap;
            scrollbar-width: none; /* Firefox */
        }

        .categories-nav::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .cat-btn {
            background: #2a2a2a;
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent);
            color: #121212;
            font-weight: bold;
        }

        /* CONTENEDOR DE PRODUCTOS */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #2a2a2a;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .product-price {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 12px;
        }

        /* CONTROL DE CANTIDADES */
        .qty-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 4px;
        }

        .qty-btn {
            background: var(--accent);
            color: #121212;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .qty-btn:active {
            background: var(--accent-hover);
        }

        .qty-val {
            font-weight: bold;
            font-size: 1rem;
            padding: 0 10px;
        }

        /* BARRA DEL CARRITO FIJA */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            border-top: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .cart-info {
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-actions {
            display: flex;
            gap: 10px;
        }

        .view-cart-btn, .cart-btn {
            background: #2a2a2a;
            color: var(--text-main);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .cart-btn {
            background: #25D366; /* Color WhatsApp */
            color: #fff;
        }

        .view-cart-btn:hover {
            background: #3a3a3a;
        }

        .cart-btn:hover {
            background: #20ba5a;
        }

        /* MODAL DEL CARRITO */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 2000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 1.3rem;
            color: var(--accent);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items-list {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 10px;
            border-radius: 8px;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .cart-item-name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delete-btn {
            background: var(--danger);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .clear-cart-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .clear-cart-btn:hover {
            background: rgba(229, 57, 53, 0.1);
        }
    </style>
</head>
<body>

    <!-- CABECERA Y LOGO -->
    <div class="header-container">
        <img src="https://raw.githubusercontent.com/miguelangulo-dev/wild_west_grill/main/menu.jpeg" alt="Logo Wild West Grill" class="logo-img" onerror="this.style.display='none'">
        <h1>WILD WEST GRILL</h1>
        <p>SMOKED CHICKEN & RIBS</p>
    </div>

    <!-- CARRUSEL VISUAL LIMPIO (SIN PRECIOS) -->
    <div class="carousel-wrapper">
        <div class="carousel">
            <div class="carousel-track" id="carouselSlide">
                <div class="carousel-slide"><img src="https://raw.githubusercontent.com/miguelangulo-dev/wild_west_grill/main/menu.jpeg" alt="Banner 1"></div>
                <div class="carousel-slide"><img src="https://raw.githubusercontent.com/miguelangulo-dev/wild_west_grill/main/costillas1.jpeg" alt="Banner 2"></div>
                <div class="carousel-slide"><img src="https://raw.githubusercontent.com/miguelangulo-dev/wild_west_grill/main/pollo1.jpeg" alt="Banner 3"></div>
            </div>
        </div>
    </div>

    <!-- BOTONES DE FILTRO DE CATEGORÍAS -->
    <div class="categories-nav" id="categoriesNav">
        <button class="cat-btn active" onclick="filterCategory('todos', this)">🔥 Todos</button>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL MENÚ -->
    <div class="container">
        <div class="menu-grid" id="menuContainer">
            <p style="text-align:center; color: var(--text-muted); grid-column: 1/-1; padding: 20px;">Cargando menú desde el sistema... 🤠</p>
        </div>
    </div>

    <!-- BARRA FIJA DEL CARRITO -->
    <div class="cart-bar">
        <div class="cart-info" onclick="toggleCartModal()">
            Total: <span id="cartTotal" style="color: var(--accent);">$0.00</span>
        </div>
        <div class="cart-actions">
            <button class="view-cart-btn" onclick="toggleCartModal()">🛒 Ver Carrito (<span id="cartCount">0</span>)</button>
            <button class="cart-btn" onclick="sendOrder()">Pedir WhatsApp 📲</button>
        </div>
    </div>

    <!-- MODAL DETALLE DEL CARRITO -->
    <div class="modal-overlay" id="cartModal" onclick="if(event.target === this) toggleCartModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛒 Tu Pedido</h2>
                <button class="close-btn" onclick="toggleCartModal()">&times;</button>
            </div>
            
            <div class="cart-items-list" id="modalCartItems">
                <!-- Se llena dinámicamente -->
            </div>

            <button class="clear-cart-btn" onclick="clearCart()">🗑️ Vaciar Carrito</button>
        </div>
    </div>

    <!-- SCRIPT DE FUNCIONAMIENTO -->
    <script>
        const URL_JSON = "https://raw.githubusercontent.com/miguelangulo-dev/wild_west_grill/main/precios.json";
        let menuData = [];
        let cart = {};

        // Carrusel automático
        let slideIndex = 0;
        const slide = document.getElementById('carouselSlide');
        setInterval(() => {
            slideIndex = (slideIndex + 1) % 3;
            slide.style.transform = `translateX(-${slideIndex * 100}%)`;
        }, 3500);

        // Cargar Menú y Precios desde GitHub
        async function cargarMenu() {
            try {
                const respuesta = await fetch(`${URL_JSON}?t=${new Date().getTime()}`);
                const datos = await respuesta.json();
                menuData = datos.menu;
                
                renderCategorias();
                renderProductos('todos');
            } catch (error) {
                console.error("Error al cargar el JSON:", error);
                document.getElementById('menuContainer').innerHTML = '<p style="text-align:center; color: var(--danger); grid-column: 1/-1; padding: 20px;">Error al cargar el menú. Intenta recargar la página.</p>';
            }
        }

        // Generar botones de categorías dinámicamente
        function renderCategorias() {
            const nav = document.getElementById('categoriesNav');
            let html = `<button class="cat-btn active" onclick="filterCategory('todos', this)">🔥 Todos</button>`;
            
            menuData.forEach(cat => {
                html += `<button class="cat-btn" onclick="filterCategory('${cat.categoria_id}', this)">${cat.categoria_nombre}</button>`;
            });
            nav.innerHTML = html;
        }

        // Renderizar tarjetas de productos en pantalla
        function renderProductos(categoriaFiltro) {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            let productosAMostrar = [];

            if (categoriaFiltro === 'todos') {
                menuData.forEach(cat => {
                    cat.productos.forEach(prod => {
                        productosAMostrar.push({ ...prod, categoria_id: cat.categoria_id });
                    });
                });
            } else {
                const catEncontrada = menuData.find(c => c.categoria_id === categoriaFiltro);
                if (catEncontrada) {
                    productosAMostrar = catEncontrada.productos.map(prod => ({ ...prod, categoria_id: catEncontrada.categoria_id }));
                }
            }

            if (productosAMostrar.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--text-muted); grid-column: 1/-1; padding: 20px;">No hay platillos en esta categoría.</p>';
                return;
            }

            productosAMostrar.forEach(prod => {
                const qtyActual = cart[prod.nombre] ? cart[prod.nombre].qty : 0;
                
                container.innerHTML += `
                    <div class="product-card" data-category="${prod.categoria_id}">
                        <img src="${prod.imagen}" class="product-img" alt="${prod.nombre}" onerror="this.src='https://raw.githubusercontent.com/miguelangulo-dev/wild_west_grill/main/menu.jpeg'">
                        <div class="product-info">
                            <div class="product-title">${prod.nombre}</div>
                            <div class="product-desc">${prod.descripcion}</div>
                            <div class="product-price">$${Number(prod.precio).toFixed(2)}</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="updateQty('${prod.nombre}', ${prod.precio}, -1)">-</button>
                                <span class="qty-val" id="qty-${prod.nombre}">${qtyActual}</span>
                                <button class="qty-btn" onclick="updateQty('${prod.nombre}', ${prod.precio}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Filtrar por categoría desde los botones
        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProductos(cat);
        }

        // Gestión del Carrito
        function updateQty(name, price, delta) {
            if (!cart[name]) {
                cart[name] = { price: price, qty: 0 };
            }

            cart[name].qty += delta;

            if (cart[name].qty <= 0) {
                delete cart[name];
            }

            renderCart();
            
            const spanQty = document.getElementById(`qty-${name}`);
            if (spanQty) {
                spanQty.textContent = cart[name] ? cart[name].qty : 0;
            }
        }

        function deleteItem(name) {
            delete cart[name];
            renderCart();
            renderProductos(document.querySelector('.cat-btn.active')?.getAttribute('onclick').match(/'([^']+)'/)[1] || 'todos');
        }

        function clearCart() {
            cart = {};
            renderCart();
            renderProductos('todos');
        }

        function renderCart() {
            let total = 0;
            let totalCount = 0;

            const itemsContainer = document.getElementById('modalCartItems');
            itemsContainer.innerHTML = '';

            let keys = Object.keys(cart);
            if (keys.length === 0) {
                itemsContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 15px;">El carrito está vacío 🤠</p>';
            } else {
                keys.forEach(name => {
                    let item = cart[name];
                    let itemTotal = item.price * item.qty;
                    total += itemTotal;
                    totalCount += item.qty;

                    itemsContainer.innerHTML += `
                        <div class="cart-item-row">
                            <div class="cart-item-info">
                                <span class="cart-item-name">${name}</span>
                                <span class="cart-item-price">$${item.price} x ${item.qty} = $${itemTotal.toFixed(2)}</span>
                            </div>
                            <div class="cart-item-actions">
                                <button class="qty-btn" onclick="updateQty('${name}', ${item.price}, -1)">-</button>
                                <span class="qty-val">${item.qty}</span>
                                <button class="qty-btn" onclick="updateQty('${name}', ${item.price}, 1)">+</button>
                                <button class="delete-btn" onclick="deleteItem('${name}')">🗑️</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
            document.getElementById('cartCount').textContent = totalCount;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('active');
        }

        function sendOrder() {
            let keys = Object.keys(cart);
            if (keys.length === 0) {
                alert("Por favor agrega al menos un platillo a tu pedido.");
                return;
            }

            let phone = "524611461994";
            let message = "🤠 *Nuevo Pedido - Wild West Grill*%0A%0A";
            let total = 0;

            keys.forEach((name) => {
                let item = cart[name];
                let subtotal = item.price * item.qty;
                total += subtotal;
                message += `• *${item.qty}x* ${name} — $${subtotal.toFixed(2)}%0A`;
            });

            message += `%0A*Total a Pagar:* $${total.toFixed(2)}`;
            message += `%0A%0A📍 *Dirección de Entrega:* (Escribe tu dirección aquí)`;

            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        // Iniciar carga al abrir la página
        window.addEventListener("DOMContentLoaded", cargarMenu);
    </script>
</body>
</html>
